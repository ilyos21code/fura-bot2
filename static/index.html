<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Fura</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8a8a8e);
    --card: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --link: var(--tg-theme-link-color, #2f6fed);
    --btn: var(--tg-theme-button-color, #2f6fed);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --header-bg: var(--tg-theme-header-bg-color, var(--bg));

    --amber: #FF9F1C;
    --amber-dim: rgba(255, 159, 28, 0.16);
    --green: #1FAA59;
    --green-dim: rgba(31, 170, 89, 0.12);
    --red: #E5484D;
    --red-dim: rgba(229, 72, 77, 0.12);

    --font-display: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    padding-bottom: 78px;
  }

  .app-header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--header-bg);
    padding: 16px 18px 0 18px;
  }

  .app-header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .app-header h1 {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 22px;
    margin: 0;
    letter-spacing: -0.02em;
  }

  .add-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: var(--btn);
    color: var(--btn-text);
    font-size: 22px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .road-divider {
    margin-top: 14px;
    height: 3px;
    border-radius: 2px;
    background-image: repeating-linear-gradient(
      to right, var(--amber) 0 14px, transparent 14px 24px
    );
    background-size: 48px 3px;
    animation: road-move 1.8s linear infinite;
  }

  @media (prefers-reduced-motion: reduce) {
    .road-divider { animation: none; }
  }

  @keyframes road-move {
    from { background-position: 0 0; }
    to { background-position: -48px 0; }
  }

  main {
    padding: 16px 18px 24px 18px;
  }

  .page { display: none; }
  .page.active { display: block; }

  .empty-state {
    text-align: center;
    padding: 48px 20px;
    color: var(--hint);
  }
  .empty-state .glyph {
    font-size: 40px;
    margin-bottom: 10px;
  }
  .empty-state button {
    margin-top: 16px;
  }

  .summary-card {
    background: var(--card);
    border-radius: 16px;
    padding: 18px;
    display: flex;
    align-items: stretch;
    margin-bottom: 18px;
  }
  .summary-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .summary-col .label {
    font-size: 12px;
    color: var(--hint);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .summary-col .value {
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 17px;
  }
  .summary-divider {
    width: 0;
    border-left: 2px dashed var(--amber);
    margin: 2px 16px;
  }
  .value.positive { color: var(--green); }
  .value.negative { color: var(--red); }

  .big-total {
    text-align: center;
    padding: 22px 10px 26px 10px;
  }
  .big-total .label {
    font-size: 13px;
    color: var(--hint);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
  }
  .big-total .value {
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 32px;
  }

  .card {
    background: var(--card);
    border-radius: 14px;
    padding: 14px 16px;
    margin-bottom: 10px;
    position: relative;
  }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
  }
  .card-title {
    font-weight: 700;
    font-size: 15px;
  }
  .card-sub {
    font-size: 12.5px;
    color: var(--hint);
    margin-top: 2px;
  }
  .card-amount {
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: 15px;
    white-space: nowrap;
  }
  .card-row {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 13px;
    color: var(--hint);
  }
  .badge {
    display: inline-block;
    font-size: 11.5px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 20px;
    background: var(--amber-dim);
    color: var(--amber);
  }
  .badge.active-badge { background: var(--green-dim); color: var(--green); }

  .section-title {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 14px;
    color: var(--hint);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 22px 0 10px 2px;
  }

  .month-bar-row { margin-bottom: 14px; }
  .month-bar-label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 5px;
  }
  .month-bar-label .m { color: var(--hint); font-family: var(--font-mono); }
  .month-bar-track {
    height: 8px;
    background: var(--card);
    border-radius: 6px;
    overflow: hidden;
    display: flex;
  }
  .month-bar-fill.income { background: var(--green); }
  .month-bar-fill.expense { background: var(--red); }

  .bottom-nav {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    display: flex;
    background: var(--header-bg);
    border-top: 1px solid var(--amber-dim);
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom)) 4px;
    z-index: 20;
  }
  .nav-btn {
    flex: 1;
    background: none;
    border: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 6px 1px;
    color: var(--hint);
    font-family: var(--font-body);
    font-size: 9.5px;
    cursor: pointer;
  }
  .nav-btn .icon { font-size: 18px; }
  .nav-btn.active { color: var(--amber); }

  .sheet-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    display: none;
    align-items: flex-end;
    z-index: 30;
  }
  .sheet-overlay.open { display: flex; }
  .sheet {
    background: var(--bg);
    width: 100%;
    border-radius: 18px 18px 0 0;
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom)) 20px;
    max-height: 85vh;
    overflow-y: auto;
  }
  .sheet h2 {
    font-family: var(--font-display);
    font-size: 18px;
    margin: 0 0 16px 0;
  }
  .field { margin-bottom: 14px; }
  .field label {
    display: block;
    font-size: 12.5px;
    color: var(--hint);
    margin-bottom: 6px;
  }
  .field input, .field select {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1px solid var(--amber-dim);
    background: var(--card);
    color: var(--text);
    font-size: 15px;
    font-family: var(--font-body);
  }
  .field input:focus, .field select:focus {
    outline: 2px solid var(--amber);
  }
  .sheet-actions { display: flex; gap: 10px; margin-top: 6px; }
  .btn-primary, .btn-secondary, .btn-danger {
    flex: 1;
    padding: 13px;
    border-radius: 12px;
    border: none;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .btn-primary { background: var(--btn); color: var(--btn-text); }
  .btn-secondary { background: var(--card); color: var(--text); }
  .btn-danger { background: var(--red-dim); color: var(--red); }

  .toast {
    position: fixed;
    top: 14px; left: 50%;
    transform: translateX(-50%);
    background: var(--text);
    color: var(--bg);
    padding: 10px 18px;
    border-radius: 30px;
    font-size: 13.5px;
    z-index: 50;
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }

  .icon-x {
    position: absolute;
    top: 10px; right: 10px;
    width: 24px; height: 24px;
    border-radius: 50%;
    border: none;
    background: var(--red-dim);
    color: var(--red);
    font-size: 14px;
    cursor: pointer;
  }

  .lang-switch {
    display: flex;
    background: var(--card);
    border-radius: 12px;
    padding: 4px;
    gap: 4px;
    margin-bottom: 22px;
  }
  .lang-btn {
    flex: 1;
    border: none;
    background: transparent;
    padding: 12px;
    border-radius: 9px;
    font-size: 15px;
    font-weight: 700;
    color: var(--hint);
    cursor: pointer;
  }
  .lang-btn.active {
    background: var(--amber);
    color: #1a1a1a;
  }

  .support-card {
    background: var(--card);
    border-radius: 16px;
    padding: 20px;
    text-align: center;
    margin-bottom: 18px;
  }
  .support-card .glyph { font-size: 34px; margin-bottom: 8px; }
  .support-card p {
    color: var(--hint);
    font-size: 13.5px;
    line-height: 1.5;
    margin: 8px 0 18px 0;
  }
  .support-btn {
    display: inline-block;
    background: var(--amber);
    color: #1a1a1a;
    text-decoration: none;
    font-weight: 700;
    font-size: 15px;
    padding: 13px 26px;
    border-radius: 12px;
  }

  .more-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 4px;
    border-bottom: 1px solid var(--card);
    font-size: 14px;
  }
  .more-row .hint { color: var(--hint); font-size: 12.5px; }

  .mini-delete {
    border: none;
    background: var(--red-dim);
    color: var(--red);
    width: 24px; height: 24px;
    min-width: 24px;
    border-radius: 50%;
    font-size: 12px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .amount-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Davlat raqami va mashina qo'shish qadamlari */
  .plate { font-family: var(--font-mono); letter-spacing: 0.04em; }
  .plate-big {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.06em;
    border: 2px solid var(--text);
    border-radius: 8px;
    padding: 6px 14px;
    margin: 2px 0 14px;
  }
  .field input.plate-input {
    font-family: var(--font-mono);
    font-size: 18px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .step-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--hint);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 4px;
  }
  .sheet-text { color: var(--hint); font-size: 14px; line-height: 1.45; margin: 0 0 16px; }
  .badge.muted-badge { background: var(--red-dim); color: var(--red); }
  .badge.watch-badge { background: var(--card); color: var(--link); border: 1px solid var(--link); }
  .btn-small {
    border: none;
    border-radius: 10px;
    padding: 6px 10px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    background: var(--green-dim);
    color: var(--green);
  }
  .btn-small.no { background: var(--red-dim); color: var(--red); }
  .btn-small.info { background: var(--amber-dim); color: var(--text); }

  /* Bozor narxi va qimmat yuklar (Qimmatyuklar bazasidan) */
  .market-box {
    background: var(--amber-dim);
    border-radius: 12px;
    padding: 10px 12px;
    margin: -4px 0 14px;
    font-size: 13.5px;
    line-height: 1.45;
  }
  .market-box b { font-family: var(--font-mono); }
  .market-box .muted { color: var(--hint); font-size: 12.5px; }
  .market-box .up { color: var(--green); font-weight: 700; }
  .market-box .down { color: var(--red); font-weight: 700; }
  .leg-market { font-size: 12.5px; color: var(--hint); margin-top: 8px; }
  .leg-market b { color: var(--text); font-family: var(--font-mono); }
  .alert-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-top: 10px;
    font-size: 12.5px;
  }
  .switch-row {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--card);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 14px;
    cursor: pointer;
  }
  .switch-row input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--btn); flex-shrink: 0; }
  .switch-row .title { font-weight: 700; font-size: 14px; }
  .switch-row .hint { color: var(--hint); font-size: 12.5px; margin-top: 3px; line-height: 1.4; }

  /* Safar narxi valyutasi: so'm / $ */
  .label-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .label-row label { margin-bottom: 0 !important; }
  .cur-switch { display: flex; background: var(--card); border-radius: 9px; padding: 3px; gap: 3px; }
  .cur-switch button {
    border: none; background: transparent; color: var(--hint);
    font-weight: 700; font-size: 13px; padding: 5px 12px; border-radius: 7px; cursor: pointer;
  }
  .cur-switch button.active { background: var(--amber); color: #1a1a1a; }
  .amount-sub { font-size: 12px; color: var(--hint); text-align: right; font-family: var(--font-mono); }
</style>
</head>

<div class="app-header">
  <div class="app-header-row">
    <h1 id="page-title">Moshinalar</h1>
    <button class="add-btn" id="add-btn">+</button>
  </div>
  <div class="road-divider"></div>
</div>

<main>
  <!-- MOSHINALAR -->
  <section class="page active" id="page-trucks"></section>

  <!-- REYSLAR -->
  <section class="page" id="page-trips"></section>

  <!-- XARAJATLAR -->

  <!-- SAFARLAR -->

  <!-- HISOBOT -->
  <section class="page" id="page-report"></section>

  <!-- KO'PROQ -->
  <section class="page" id="page-more"></section>
</main>

<nav class="bottom-nav">
  <button class="nav-btn active" data-page="trucks"><span class="icon">🚛</span><span class="nav-label" data-key="Moshinalar">Moshinalar</span></button>

  <button class="nav-btn" data-page="legs"><span class="icon">📍</span><span class="nav-label" data-key="Safarlar">Safarlar</span></button>
  <button class="nav-btn" data-page="report"><span class="icon">📊</span><span class="nav-label" data-key="Hisobot">Hisobot</span></button>
  <button class="nav-btn" data-page="more"><span class="icon">⚙️</span><span class="nav-label" data-key="Ko'proq">Ko'proq</span></button>
</nav>

<div class="sheet-overlay" id="sheet-overlay">
  <div class="sheet" id="sheet-content"></div>
</div>

<div class="toast" id="toast"></div>

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

let currentCurrency = localStorage.getItem("fura_currency") || "UZS";

function setCurrency(cur) {
  currentCurrency = cur;
  localStorage.setItem("fura_currency", cur);
  renderPage(state.page);
}

function formatSum(n) {
  const num = Math.round(Number(n) || 0);
  if (currentCurrency === "USD") {
    const usd = num / state.usdRate;
    const sign = usd < 0 ? "-" : "";
    return sign + "$" + Math.abs(usd).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  const sign = num < 0 ? "-" : "";
  const abs = Math.abs(num).toString();
  const withSpaces = abs.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return sign + withSpaces + " so'm";
}

// "1 500 000", "1,500,000", "1.500.000" va "12,5" ko'rinishidagi summalarni o'qiydi
function parseAmount(raw) {
  let s = String(raw).replace(/\s/g, "");
  if (/^\d{1,3}([.,]\d{3})+$/.test(s)) s = s.replace(/[.,]/g, "");
  else s = s.replace(",", ".");
  const n = Number(s);
  return Number.isFinite(n) ? n : NaN;
}

// Summani valyutasi bilan: 2 500 000 so'm / $2 500 (umumiy UZS/USD tanloviga bog'liq emas)
function fmtMoney(n, cur) {
  const num = Number(n) || 0;
  const digits = cur === "USD" && Math.round(num) !== num ? 2 : 0;
  const [i, d] = Math.abs(num).toFixed(digits).split(".");
  const text = i.replace(/\B(?=(\d{3})+(?!\d))/g, " ") + (d ? "," + d : "");
  const sign = num < 0 ? "-" : "";
  return cur === "USD" ? `${sign}$${text}` : `${sign}${text} so'm`;
}

// Summa maydonlari (data-amount): yozish paytida raqamlar 3 tadan ajratiladi —
// 650 000 bilan 6 500 000 ni adashtirmaslik uchun. "," yoki "." — tiyin/sent.
function formatAmountInput(el) {
  const raw = el.value;
  const caret = el.selectionStart == null ? raw.length : el.selectionStart;
  const significant = str => str.replace(/[^\d.,]/g, "").length;
  const before = significant(raw.slice(0, caret));
  const clean = raw.replace(/[^\d.,]/g, "");
  const sep = clean.search(/[.,]/);
  let intPart = sep >= 0 ? clean.slice(0, sep) : clean;
  const dec = sep >= 0 ? clean.slice(sep + 1).replace(/[.,]/g, "").slice(0, 2) : null;
  intPart = intPart.replace(/^0+(?=\d)/, "");
  const out = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, " ") + (dec !== null ? "," + dec : "");
  if (out === raw) return;
  el.value = out;
  let pos = 0, seen = 0;
  while (pos < out.length && seen < before) {
    if (out[pos] !== " ") seen++;
    pos++;
  }
  el.setSelectionRange(pos, pos);
}

// capture — sahifadagi oninput'lardan (masalan bozor narxi bilan solishtirish) oldin ishlaydi
document.addEventListener("input", e => {
  if (e.target.matches && e.target.matches("input[data-amount]")) formatAmountInput(e.target);
}, true);
// Bo'shliq oldida Backspace bosilsa, bo'shliqni emas, undan oldingi raqamni o'chiramiz
document.addEventListener("keydown", e => {
  const el = e.target;
  if (e.key !== "Backspace" || !el.matches || !el.matches("input[data-amount]")) return;
  const pos = el.selectionStart;
  if (pos && pos === el.selectionEnd && el.value[pos - 1] === " ") el.setSelectionRange(pos - 1, pos - 1);
}, true);

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2200);
}

async function api(path, options = {}) {
  const headers = Object.assign(
    { "Content-Type": "application/json", "X-Telegram-Init-Data": initData },
    options.headers || {}
  );
  const res = await fetch(path, Object.assign({}, options, { headers }));
  if (!res.ok) {
    let detail = "Xatolik yuz berdi";
    try {
      const body = await res.json();
      if (typeof body.detail === "string") detail = body.detail;
    } catch (e) {}
    const err = new Error(detail);
    err.status = res.status;
    throw err;
  }
  if (res.status === 204) return null;
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

async function loadAll() {
  const [trucks, trips, activeTrips, report, sharing, market, rate] = await Promise.all([
    api("/api/trucks"),
    api("/api/trips"),
    api("/api/trips/active"),
    api("/api/report"),
    api("/api/sharing"),
    api("/api/market/status").catch(() => ({ available: false })),
    api("/api/rate").catch(() => null),
  ]);
  state.marketAvailable = !!(market && market.available);
  if (rate && rate.usd_uzs) state.usdRate = rate.usd_uzs;
  state.trucks = trucks;
  state.trips = trips;
  state.activeTrips = activeTrips;
  state.report = report;
  state.sharing = sharing;

  // Tanlangan reys endi mavjud bo'lmasa yoki hali tanlanmagan bo'lsa - birinchisini tanlaymiz
  if (!state.activeTrips.find(t => t.id === state.selectedExpenseTripId)) {
    state.selectedExpenseTripId = state.activeTrips.length ? state.activeTrips[0].id : null;
  }
  if (!state.activeTrips.find(t => t.id === state.selectedLegTripId)) {
    state.selectedLegTripId = state.activeTrips.length ? state.activeTrips[0].id : null;
  }
}

  if (page === "trucks") renderTrucks();
  if (page === "trips") renderTrips();
  if (page === "expenses") renderExpenses();
  if (page === "legs") renderLegs();
  if (page === "report") renderReport();
  if (page === "more") renderMore();
}

// "MAN · 90 kub" (eski, raqamsiz qo'shilgan furalarda - qo'shilgan sana)
function truckSpecs(t) {
  const parts = [];
  if (t.brand) parts.push(escapeHtml(t.brand));
  if (t.volume) parts.push(`${Number(t.volume).toLocaleString("ru-RU")} ${tr("kub")}`);
  if (parts.length) return parts.join(" · ");
  return t.created_at ? `${tr("Qo'shilgan")}: ${escapeHtml(t.created_at)}` : "";
}

function renderTrucks() {
  const el = document.getElementById("page-trucks");
  const sh = state.sharing;
  if (state.trucks.length === 0 && sh.watching.length === 0 && sh.incoming.length === 0) {
    el.innerHTML = `<div class="empty-state">
      <div class="glyph">🚛</div>
      ${tr("Hali fura qo'shilmagan.")}<br>${tr("Boshlash uchun yuqoridagi + tugmasini bosing.")}
    </div>`;
    return;
  }

  let html = "";
  if (sh.incoming.length) {
    html += `<div class="section-title">${tr("Kuzatish so'rovlari")}</div>`;
    html += sh.incoming.map(r => `
      <div class="card">
        <div class="card-title">👀 ${escapeHtml(r.watcher_name)}</div>
        <div class="card-sub">${tr("mashinangizni kuzatmoqchi")}: <span class="plate">${escapeHtml(r.truck_name)}</span></div>
        <div class="sheet-actions" style="margin-top:12px;">
          <button class="btn-secondary" onclick="decideWatch(${r.id}, false)">${tr("Rad etish")}</button>
          <button class="btn-primary" onclick="decideWatch(${r.id}, true)">${tr("Ruxsat berish")}</button>
        </div>
      </div>
    `).join("");
  }

  html += `<div class="section-title">${tr("Mening mashinalarim")} · ${state.trucks.length}/${sh.max_trucks}</div>`;
  html += state.trucks.length ? state.trucks.map(t => `
    <div class="card" data-truck-id="${t.id}">
      <div class="card-top">
        <div>
          <div class="card-title plate">${escapeHtml(t.name)}</div>
          <div class="card-sub">${truckSpecs(t)}</div>
        </div>
        <span class="badge">${tr("Ta'mirlash")}: ${formatSum(t.repair_total)}</span>
      </div>
    </div>
  `).join("") : `<div class="card-sub" style="margin-bottom:10px;">${tr("Hali fura qo'shilmagan.")}</div>`;

  if (sh.watching.length) {
    const badges = {
      approved: `<span class="badge watch-badge">👁 ${tr("Kuzatilmoqda")}</span>`,
      pending: `<span class="badge">⏳ ${tr("Kutilmoqda")}</span>`,
      rejected: `<span class="badge muted-badge">${tr("Rad etilgan")}</span>`,
    };
    html += `<div class="section-title">${tr("Kuzatilayotgan mashinalar")}</div>`;
    html += sh.watching.map(w => `
      <div class="card" ${w.status === "approved" ? `data-watch-truck-id="${w.truck_id}"` : ""}>
        <div class="card-top">
          <div>
            <div class="card-title plate">${escapeHtml(w.truck_name)}</div>
            <div class="card-sub">${truckSpecs(w)}</div>
          </div>
          <span class="amount-row">
            ${badges[w.status] || ""}
            ${w.status !== "approved" ? `<button class="mini-delete" onclick="cancelWatch(${w.id}, '${w.status}')">✕</button>` : ""}
          </span>
        </div>
      </div>
    `).join("");
  }

  el.innerHTML = html;
  el.querySelectorAll("[data-truck-id]").forEach(card => {
    card.addEventListener("click", () => openTruckDetail(Number(card.dataset.truckId)));
  });
  el.querySelectorAll("[data-watch-truck-id]").forEach(card => {
    card.addEventListener("click", () => openWatchedTruck(Number(card.dataset.watchTruckId)));
  });
}

  showTruckPlateStep();
}

function showTruckPlateStep() {
  openSheet(`
    ${stepLabel(1)}
    <h2>${tr("Yangi fura qo'shish")}</h2>
    <div class="field">
      <label>${tr("Davlat raqami")}</label>
      <input type="text" id="nt-plate" class="plate-input" autocomplete="off" autocapitalize="characters"
             placeholder="01 A 123 BC" value="${escapeHtml(state.newTruck.plateRaw)}" ${onEnter("submitTruckPlateStep")}>
    </div>
    <div class="sheet-actions">
      <button class="btn-secondary" onclick="closeSheet()">${tr("Bekor qilish")}</button>
      <button class="btn-primary" onclick="submitTruckPlateStep()">${tr("Keyingi")}</button>
    </div>
  `);
  focusInput("nt-plate");
}

async function submitTruckPlateStep() {
  const raw = document.getElementById("nt-plate").value.trim();
  if (!raw) return showToast(tr("Davlat raqamini kiriting"));
  let res;
  try {
    res = await api(`/api/trucks/check?plate=${encodeURIComponent(raw)}`);
  } catch (e) { return showToast(tr(e.message)); }
  Object.assign(state.newTruck, { plateRaw: raw, plate: res.plate, display: res.display });
  if (res.status === "mine") return showToast(tr("Bu mashina sizda allaqachon bor"));
  if (res.status === "taken") return showPlateTaken(res.request);
  showTruckBrandStep();
}

// Raqam boshqa akkauntda band: kuzatish uchun so'rov yuborishni taklif qilamiz
function showPlateTaken(requestStatus) {
  const nt = state.newTruck;
  let body;
  if (requestStatus === "pending") {
    body = `<p class="sheet-text">⏳ ${tr("So'rovingiz yuborilgan, egasining javobini kuting.")}</p>`;
  } else if (requestStatus === "approved") {
    body = `<p class="sheet-text">👁 ${tr("Siz bu mashinani allaqachon kuzatyapsiz.")}</p>`;
  } else if (requestStatus === "rejected") {
    body = `<p class="sheet-text">${tr("Mashina egasi so'rovingizni rad etgan")}.</p>`;
  }
  const actions = body ? `
    <div class="sheet-actions">
      <button class="btn-primary" onclick="closeSheet()">${tr("Tushunarli")}</button>
    </div>` : `
    <p class="sheet-text">${tr("Agar bu mashinani kuzatmoqchi bo'lsangiz, egasiga so'rov yuboring. U ruxsat bersa, mashinaning xarajatlari va reyslarini ko'ra olasiz.")}</p>
    <div class="sheet-actions">
      <button class="btn-secondary" onclick="showTruckPlateStep()">${tr("Orqaga")}</button>
      <button class="btn-primary" onclick="sendWatchRequest()">${tr("So'rov yuborish")}</button>
    </div>`;
  openSheet(`
    <h2>🚫 ${tr("Bu raqamli mashina allaqachon qo'shilgan")}</h2>
    <div class="plate-big">${escapeHtml(nt.display)}</div>
    ${body || ""}
    ${actions}
  `);
}

    await loadAll();

async function submitAddTruck() {
  const nt = state.newTruck;
  const volume = parseAmount(document.getElementById("nt-volume").value);
  if (!volume || volume <= 0) return showToast(tr("Hajmni kiriting"));
  try {
    await api("/api/trucks", {
      method: "POST", body: JSON.stringify({ plate: nt.plate, brand: nt.brand, volume })
    });
    closeSheet();
    state.newTruck = null;
    await loadAll();
    renderTrucks();
    showToast(tr("Fura qo'shildi"));
  } catch (e) {
    // Shu orada boshqa akkaunt xuddi shu raqamni qo'shib ulgurgan bo'lsa
    if (e.status === 409) return showPlateTaken(null);
    showToast(tr(e.message));
  }
}

async function decideWatch(watchId, approve, reopenTruckId) {
  try {
    await api(`/api/watch/${watchId}/${approve ? "approve" : "reject"}`, { method: "POST" });
    await loadAll();
    renderTrucks();
    showToast(tr(approve ? "Ruxsat berildi" : "Rad etildi"));
    if (reopenTruckId) openTruckDetail(reopenTruckId);
  } catch (e) { showToast(tr(e.message)); }
}

async function removeWatcher(truckId, watchId) {
  if (!confirm(tr("Bu kuzatuvchini olib tashlaysizmi?"))) return;
  try {
    await api(`/api/watch/${watchId}`, { method: "DELETE" });
    showToast(tr("Olib tashlandi"));
    openTruckDetail(truckId);
  } catch (e) { showToast(tr(e.message)); }
}

async function cancelWatch(watchId, status) {
  const question = status === "approved" ? "Kuzatishni to'xtatasizmi?" : "So'rovni bekor qilasizmi?";
  if (!confirm(tr(question))) return;
  try {
    await api(`/api/watch/${watchId}`, { method: "DELETE" });
    closeSheet();
    await loadAll();
    renderTrucks();
    showToast(tr("Olib tashlandi"));
  } catch (e) { showToast(tr(e.message)); }
}

    <div class="card-row">

      <span>${formatSum(e.amount)}</span>

  `).join("") : `<div class="card-sub">${tr("Xarajat yo'q")}</div>`;

  openSheet(`
    <span class="badge watch-badge">👁 ${tr("Faqat ko'rish")}</span>
    <div style="margin-top:12px;"><div class="plate-big">${escapeHtml(w.truck.name)}</div></div>

        <span class="value">${formatSum(w.income)}</span>
      </div>
      <div class="summary-divider"></div>
      <div class="summary-col">
        <span class="label">${tr("Xarajat")}</span>
        <span class="value">${formatSum(w.expense)}</span>
      </div>
    </div>
    <div class="card-amount value ${profitClass}" style="font-size:17px; margin-bottom:6px;">
      ${tr("Sof foyda")}: ${formatSum(w.profit)}
    </div>
    <div class="section-title">${tr("Reyslar")}</div>
    ${tripsHtml}
    <div class="section-title">${tr("Ta'mirlash xarajatlari")}</div>
    ${repairsHtml}

      <button class="btn-secondary" onclick="closeSheet()">${tr("Orqaga")}</button>

async function openTruckDetail(truckId) {

    api(`/api/trucks/${truckId}/expenses`),
    api(`/api/trucks/${truckId}/watchers`),
  ]);
  const watchersHtml = watchers.length ? watchers.map(w => `
    <div class="card-row" style="align-items:center;">
      <span>${escapeHtml(w.name)}</span>
      <span class="amount-row">
        ${w.status === "pending" ? `
          <button class="btn-small" onclick="decideWatch(${w.id}, true, ${truckId})">${tr("Ruxsat berish")}</button>
          <button class="btn-small no" onclick="decideWatch(${w.id}, false, ${truckId})">${tr("Rad etish")}</button>

        <div>
          <div class="card-title">${escapeHtml(tr(e.category))}</div>

          <div class="card-amount">${formatSum(e.amount)}</div>

        </div>
      </div>
    </div>
  `).join("") : `<div class="empty-state" style="padding:24px 0;">${tr("Xarajat yo'q")}</div>`;

  openSheet(`
    <h2 class="plate">${escapeHtml(truck.name)}</h2>
    <div class="card-sub" style="margin:-8px 0 14px;">${truckSpecs(truck)}</div>
    <div class="sheet-actions" style="margin-bottom:16px;">
      <button class="btn-primary" onclick="openAddTruckExpenseSheet(${truckId})">${tr("+ Xarajat qo'shish")}</button>
      <button class="btn-danger" onclick="confirmDeleteTruck(${truckId})">${tr("O'chirish")}</button>

// ---------------- REYSLAR ----------------
function renderTrips() {
  const el = document.getElementById("page-trips");
  const active = state.trips.filter(t => t.status === "active");
  const finished = state.trips.filter(t => t.status === "finished");

  let html = "";

  if (active.length === 0 && finished.length === 0) {
    el.innerHTML = `<div class="empty-state">
      <div class="glyph">🧭</div>
      ${tr("Hali reys yo'q.")}<br>${tr("Yangi reys boshlash uchun + tugmasini bosing.")}
    </div>`;
    return;
  }

  if (active.length) {
    html += `<div class="section-title">${tr("Faol reys")}</div>`;
    html += active.map(t => tripCardHtml(t, true)).join("");
  }
  if (finished.length) {
    html += `<div class="section-title">${tr("Tugagan reyslar")}</div>`;
    html += finished.map(t => tripCardHtml(t, false)).join("");
  }
  el.innerHTML = html;

  el.querySelectorAll(".card").forEach(card => {
    card.addEventListener("click", () => openTripDetail(Number(card.dataset.tripId)));
  });
}

function tripCardHtml(t, isActive) {
  const profitClass = t.profit >= 0 ? "positive" : "negative";
  return `
    <div class="card" data-trip-id="${t.id}">
      <div class="card-top">
        <div>
          <div class="card-title">${escapeHtml(t.truck_name)}</div>
          <div class="card-sub">${escapeHtml(t.created_at)}</div>
        </div>
        <span class="badge ${isActive ? "active-badge" : ""}">${isActive ? tr("Faol") : tr("Tugagan")}</span>
      </div>
      <div class="card-row">
        <span>${tr("Daromad")}: ${formatSum(t.income)}</span>
        <span>${tr("Xarajat")}: ${formatSum(t.expense)}</span>
      </div>
      <div class="card-row">
        <span class="card-amount value ${profitClass}">${tr("Foyda")}: ${formatSum(t.profit)}</span>
      </div>
    </div>
  `;
}

function openAddTripSheet() {
  if (state.trucks.length === 0) {
    return openSheet(`
      <h2>${tr("Avval fura qo'shing")}</h2>
      <p style="color:var(--hint);">${tr("Reys boshlash uchun kamida bitta fura kerak.")}</p>
      <div class="sheet-actions">
        <button class="btn-primary" onclick="closeSheet()">${tr("Tushunarli")}</button>
      </div>
    `);
  }
  const activeTruckIds = new Set(state.activeTrips.map(t => t.truck_id));
  const availableTrucks = state.trucks.filter(t => !activeTruckIds.has(t.id));
  if (availableTrucks.length === 0) {
    return openSheet(`
      <h2>${tr("Barcha furalar band")}</h2>
      <p style="color:var(--hint);">${tr("Barcha furalaringizda hozir faol reys bor. Yangisini boshlash uchun avval birortasini yakunlang, yoki yangi fura qo'shing.")}</p>
      <div class="sheet-actions">
        <button class="btn-primary" onclick="closeSheet()">${tr("Tushunarli")}</button>
      </div>
    `);
  }
  const options = availableTrucks.map(t => `<option value="${t.id}">${escapeHtml(t.name)}</option>`).join("");
  openSheet(`
    <h2>${tr("Yangi reys boshlash")}</h2>
    <div class="field">
      <label>${tr("Fura")}</label>
      <select id="trip-truck-id">${options}</select>

// readOnly = boshqa akkauntning mashinasini kuzatish (o'chirish/yakunlash tugmalarisiz)
function tripDetailHtml(trip, readOnly) {
  const tripId = trip.id;
  const delBtn = (fn, id) => readOnly ? "" : `<button class="mini-delete" onclick="${fn}(${tripId}, ${id})">✕</button>`;
  const legsHtml = trip.legs.length ? trip.legs.map(l => `
    <div class="card-row">
      <span>${escapeHtml(l.from_point)} → ${escapeHtml(l.to_point)}</span>
      <span class="amount-row">
        <span>${legAmountText(l)}</span>
        ${delBtn("deleteTripLeg", l.id)}
      </span>
    </div>
  `).join("") : `<div class="card-row"><span style="color:var(--hint)">${tr("Safar qo'shilmagan")}</span></div>`;

  const expHtml = trip.expenses.length ? trip.expenses.map(e => `
    <div class="card-row">
      <span>${escapeHtml(tr(e.category))}${e.note ? " · " + escapeHtml(e.note) : ""}</span>
      <span class="amount-row">
        <span>${formatSum(e.amount)}</span>
        ${delBtn("deleteTripExpense", e.id)}
      </span>
    </div>
  `).join("") : `<div class="card-row"><span style="color:var(--hint)">${tr("Xarajat qo'shilmagan")}</span></div>`;

  const profitClass = trip.profit >= 0 ? "positive" : "negative";
  const actions = readOnly ? `
      <button class="btn-secondary" onclick="openWatchedTruck(${trip.truck_id})">${tr("Orqaga")}</button>
    ` : `
      ${trip.status === "active" ? `<button class="btn-primary" onclick="confirmFinishTrip(${trip.id})">${tr("Reysni yakunlash")}</button>` : ""}
      <button class="btn-danger" onclick="confirmDeleteTrip(${trip.id})">${tr("Reysni o'chirish")}</button>
    `;

  return `
    ${readOnly ? `<span class="badge watch-badge" style="margin-bottom:10px;">👁 ${tr("Faqat ko'rish")}</span>` : ""}
    <h2>${escapeHtml(trip.truck_name)} — ${tr("reys")} #${trip.id}</h2>
    <div class="summary-card" style="margin-bottom:16px;">
      <div class="summary-col">
        <span class="label">${tr("Daromad")}</span>
        <span class="value">${formatSum(trip.income)}</span>
      </div>
      <div class="summary-divider"></div>
      <div class="summary-col">
        <span class="label">${tr("Xarajat")}</span>
        <span class="value">${formatSum(trip.expense)}</span>
      </div>
    </div>
    <div class="card-amount value ${profitClass}" style="font-size:17px; margin-bottom:16px;">
      ${tr("Sof foyda")}: ${formatSum(trip.profit)}
    </div>
    <div class="section-title">${tr("Safarlar")}</div>
    ${legsHtml}
    <div class="section-title">${tr("Xarajatlar")}</div>
    ${expHtml}
    <div class="sheet-actions" style="margin-top:18px;">
      ${actions}
    </div>
  `;
}

// ---------------- Bozor narxi (Qimmatyuklar bazasidan) ----------------
const marketCache = {};

async function fetchRouteStats(from, to) {
  const key = (from + "|" + to).toLowerCase();
  if (!marketCache[key]) {
    marketCache[key] = api(`/api/market/route?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}`)
      .catch(() => { delete marketCache[key]; return { available: false }; });
  }
  return marketCache[key];
}

// Dollarda kiritilgan safar — dollarda, so'mdagisi — umumiy UZS/USD tanlovi bo'yicha
function legAmountText(l) {
  return l.currency === "USD" ? fmtMoney(l.amount, "USD") : formatSum(l.price);
}

function avgIn(stats, cur) {
  return Math.round(cur === "USD" ? stats.avg_usd : stats.avg_uzs);
}

function hasAverage(stats) {
  return stats && stats.available && stats.avg_uzs;
}

function compareText(price, avg) {
  if (!price || !avg) return "";
  const pct = Math.round((price / avg - 1) * 100);
  if (pct === 0) return tr("o'rtacha narxda");
  return `${tr("Sizning narxingiz o'rtachadan")} <span class="${pct > 0 ? "up" : "down"}">${Math.abs(pct)}% ${tr(pct > 0 ? "yuqori" : "past")}</span>`;
}

async function fillLegMarket(leg) {
  const stats = await fetchRouteStats(leg.from_point, leg.to_point);
  const el = document.getElementById(`leg-market-${leg.id}`);
  if (!el) return;
  if (!hasAverage(stats)) { el.remove(); return; }
  const avgText = leg.currency === "USD" ? fmtMoney(avgIn(stats, "USD"), "USD") : formatSum(stats.avg_uzs);
  el.innerHTML = `📊 ${tr("Bozorda o'rtacha")}: <b>${avgText}</b>
    (${stats.count} ${tr("ta yuk")}, ${stats.days} ${tr("kun")}) · ${compareText(leg.price, stats.avg_uzs)}`;
}

let legMarketTimer = null;
let legMarketSeq = 0;

// Safar qo'shish oynasi: valyuta (so'm / $) va bozor narxi
let legCurrency = "UZS";
let legCurrencyManual = false;   // foydalanuvchi o'zi tanlagan bo'lsa, yo'nalish bo'yicha almashtirmaymiz
let legStats = null;

function onLegRouteInput() {
  clearTimeout(legMarketTimer);
  legMarketTimer = setTimeout(updateLegRoute, 450);
  updateAlertHint();
}

function setLegCurrency(cur, manual) {
  if (manual) legCurrencyManual = true;
  legCurrency = cur;
  document.querySelectorAll("#leg-cur button").forEach(b => b.classList.toggle("active", b.dataset.cur === cur));
  renderLegMarket();
  updateLegCompare();
}

async function updateLegRoute() {
  const box = document.getElementById("leg-market");
  const from = document.getElementById("leg-from").value.trim();
  const to = document.getElementById("leg-to").value.trim();
  legStats = null;
  if (!from || !to) { if (box) box.hidden = true; return; }
  const seq = ++legMarketSeq;
  if (box) {
    box.hidden = false;
    box.innerHTML = `<span class="muted">${tr("Bozor narxi qidirilmoqda...")}</span>`;
  }
  const stats = await fetchRouteStats(from, to);
  if (seq !== legMarketSeq || !document.getElementById("leg-price")) return;
  legStats = stats;
  // O'zbekiston ichi — so'm, xalqaro — dollar (qo'lda tanlanmagan bo'lsa)
  if (!legCurrencyManual && stats.currency_hint && stats.currency_hint !== legCurrency) {
    setLegCurrency(stats.currency_hint, false);
  } else {
    renderLegMarket();
    updateLegCompare();
  }
}

function renderLegMarket() {
  const box = document.getElementById("leg-market");
  if (!box || !legStats) return;
  const stats = legStats;
  if (!stats.available) { box.hidden = true; return; }
  if (!hasAverage(stats)) {
    box.innerHTML = `<span class="muted">📊 ${tr("Bu yo'nalishda oxirgi kunlarda yetarli yuk topilmadi")}</span>`;
    return;
  }
  box.innerHTML = `📊 ${tr("Bozorda o'rtacha")}: <b>${fmtMoney(avgIn(stats, legCurrency), legCurrency)}</b><br>
    <span class="muted">${escapeHtml(stats.from)} → ${escapeHtml(stats.to)} · ${tr("oxirgi")} ${stats.days} ${tr("kun")}, ${stats.count} ${tr("ta yuk")}</span>
    <div id="leg-compare"></div>`;
}

function updateLegCompare() {
  const price = parseAmount(document.getElementById("leg-price").value);
  const sub = document.getElementById("leg-price-sub");
  if (sub) {
    sub.textContent = legCurrency === "USD" && price > 0
      ? `≈ ${fmtMoney(price * state.usdRate, "UZS")} (1$ = ${fmtMoney(state.usdRate, "UZS")})`
      : "";
  }
  const el = document.getElementById("leg-compare");
  if (!el || !hasAverage(legStats)) return;
  el.innerHTML = price > 0 ? compareText(price, avgIn(legStats, legCurrency)) : "";
}

    <div class="lang-switch">
      <button class="lang-btn ${currentLang === "lotin" ? "active" : ""}" onclick="setLanguage('lotin')">Lotin</button>
      <button class="lang-btn ${currentLang === "kirill" ? "active" : ""}" onclick="setLanguage('kirill')">Кирилл</button>
    </div>

    <div class="section-title">${tr("Valyuta")}</div>
    <div class="lang-switch">
      <button class="lang-btn ${currentCurrency === "UZS" ? "active" : ""}" onclick="setCurrency('UZS')">UZS</button>
      <button class="lang-btn ${currentCurrency === "USD" ? "active" : ""}" onclick="setCurrency('USD')">USD</button>
    </div>
    <p style="color: var(--hint); font-size: 12px; margin: -12px 0 22px 2px;">${tr("Kurs taxminiy: 1 USD ~ 12 000 so'm. Barcha ma'lumot so'mda saqlanadi, faqat ko'rinishi o'zgaradi.")}</p>

    <div class="section-title">${tr("Qo'llab-quvvatlash")}</div>
    <div class="support-card">
      <div class="glyph">☕</div>
      <p>${tr("Bu bot mustaqil ishlab chiqilgan va bepul taqdim etiladi. Agar foydali deb topsangiz, rivojlantirishni qo'llab-quvvatlashingiz mumkin.")}</p>
      <div style="font-family: var(--font-mono); font-size: 19px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 4px;">
        ${SUPPORT_CARD_NUMBER}
      </div>
      <div style="color: var(--hint); font-size: 13px; margin-bottom: 18px;">${SUPPORT_CARD_HOLDER}</div>
      <button class="support-btn" onclick="copySupportCard()">${tr("Nusxalash")}</button>
    </div>
  `;
}

function copySupportCard() {
  const number = SUPPORT_CARD_NUMBER.replace(/\s/g, "");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(number)
      .then(() => showToast(tr("Nusxalandi")))
      .catch(() => showToast(number));
  } else {
    showToast(number);
  }
}



// ---------------- Ishga tushirish ----------------
(async function init() {
  applyStaticLabels();
  try {
    await loadAll();
    renderPage(state.page);
  } catch (e) {
    document.getElementById("page-trucks").innerHTML = `<div class="empty-state">Xatolik: ${escapeHtml(e.message)}</div>`;
  }
})();

</script>
